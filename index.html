<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121519">
<meta name="description" content="Rol de mesa 5e sin final con un máster IA. Juega solo o con amigos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mesa del Máster</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Concepto: una mesa de juego de noche. La crónica del máster en el centro como páginas de libro a la luz de una vela; el grupo y las fichas alrededor. Mundo único oscuro, elegido a propósito. */
:root{
  --bg:#121519; --panel:#1a1f26; --panel2:#222932; --line:#323a46; --ink:#ece5d7; --muted:#a0a8b2; --faint:#6e7783;
  --candle:#e8ad5d; --candle-ink:#1c1308; --candle-soft:rgba(232,173,93,.13);
  --blood:#d65c4e; --sage:#83b892; --arcane:#a29cf0; --page:#1d1a16; --page-line:#3a3228; --page-ink:#f0e7d3;
  --f-display:'IM Fell English SC','Palatino Linotype',Georgia,serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
#app{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05}
h2{font-size:24px;line-height:1.15}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 14px;line-height:1.2;transition:background .15s,border-color .15s}
button:hover{border-color:var(--faint)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--candle);color:var(--candle-ink);border-color:var(--candle);font-weight:700}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:transparent}
button.small{padding:5px 10px;font-size:14px}
button.danger{border-color:var(--blood);color:var(--blood);background:transparent}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--panel2)}
.chip.on{border-color:var(--candle);background:var(--candle-soft);color:var(--candle)}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--panel2);border:1px solid var(--line)}
.ok{color:var(--sage)}.bad{color:var(--blood)}.arc{color:var(--arcane)}.gold{color:var(--candle)}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;color:var(--candle)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;width:100%}
.tabs button{border:none;background:transparent;border-radius:6px;padding:7px 12px;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--candle);background:var(--candle-soft)}

/* Lobby */
.hero{padding-block:36px 22px;display:grid;gap:14px;max-width:720px}
.hero p{font-size:18px;color:var(--muted);max-width:60ch}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.camp{text-align:left;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;background:var(--panel);min-width:0}
.camp:hover{border-color:var(--candle)}

/* Mesa */
.table{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-top:16px}
@media (max-width:880px){.table{grid-template-columns:minmax(0,1fr)}.side{display:none}}
.log{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.page{background:var(--page);border:1px solid var(--page-line);border-radius:4px 14px 14px 4px;padding:20px 22px;color:var(--page-ink);font-size:17.5px;line-height:1.62;box-shadow:inset 3px 0 0 var(--page-line)}
.page p+p{margin-top:.75em}
.page p:first-child::first-letter{font-family:var(--f-display);font-size:2.6em;float:left;line-height:.9;padding:4px 8px 0 0;color:var(--candle)}
.page .meta{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;font-family:var(--f-body)}
.page.live{border-style:dashed}
.say{display:flex;gap:10px;align-items:flex-start;max-width:640px}
.say .dot{width:10px;height:10px;border-radius:50%;margin-top:8px;flex:none}
.say .who{font-weight:700;margin-right:6px}
.rollline{display:flex;gap:10px;align-items:center;font-size:15px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.rollline .tot{font-family:var(--f-mono);font-weight:600;font-size:20px;min-width:2ch;text-align:center}
.die{width:30px;height:30px;flex:none;color:var(--candle)}
.sys{font-size:14px;color:var(--muted);padding-left:4px;border-left:2px solid var(--line);padding-block:2px;padding-right:0;margin-left:2px}
.compose{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18px);padding-block:18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.compose .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.compose textarea{min-height:52px;border:none;background:transparent;padding:4px}
.compose textarea:focus-visible{outline:none}
.pending{border:1px solid var(--candle);background:var(--candle-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pending .req{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.combat{border:1px solid var(--blood);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(214,92,78,.06)}
.foe{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;font-size:15px}
.bar{height:7px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:9px;transition:width .4s}
.bar.foebar i{background:var(--blood)}
.bar.xp i{background:var(--candle)}

/* Grupo */
.pc{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.pc:hover{border-color:var(--faint)}
.pc .nm{font-family:var(--f-display);font-size:19px;display:flex;gap:8px;align-items:center}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-top:16px}

/* Ficha */
.sheet{display:grid;gap:16px;padding-top:16px}
.sheet-head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.abil{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ab .m{font-family:var(--f-mono);font-size:24px;font-weight:600}
.ab .s{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.vital{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.vital b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:8px;align-items:center;border:none;background:transparent;text-align:left;width:100%}
button.li:hover{background:var(--panel2)}
.li .b{font-family:var(--f-mono);min-width:3ch;text-align:right}
.prof::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--candle);margin-right:8px;vertical-align:middle}
.noprof::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--faint);margin-right:8px;vertical-align:middle}
details.feat{border-bottom:1px solid var(--line);padding-block:8px}
details.feat summary{cursor:pointer;font-weight:500}
details.feat p{color:var(--muted);font-size:15px;margin-top:4px}
.slots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slot{width:20px;height:20px;border-radius:50%;border:2px solid var(--arcane);background:var(--arcane);padding:0}
.slot.used{background:transparent}

/* Creación */
.wiz{display:grid;gap:22px;padding-top:18px;max-width:880px}
.step{display:grid;gap:12px}
.step h2{display:flex;gap:10px;align-items:baseline}
.step h2 .n{font-family:var(--f-mono);font-size:14px;color:var(--candle)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:3px;min-width:0}
.opt.on{border-color:var(--candle);background:var(--candle-soft)}
.opt small{color:var(--muted);font-size:13px;line-height:1.35}
.assign{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.assign{grid-template-columns:repeat(3,minmax(0,1fr))}}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer}
.checks label.on{border-color:var(--candle);color:var(--candle)}
.checks label.dis{opacity:.4;cursor:not-allowed}
.checks input{width:auto;accent-color:var(--candle)}

/* Dados */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.tray button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;font-family:var(--f-mono)}
.tray svg{width:34px;height:34px;color:var(--candle)}
.bigroll{font-family:var(--f-mono);font-size:64px;font-weight:600;color:var(--candle);line-height:1}
@keyframes spin{0%{transform:rotate(0) scale(.6);opacity:.2}100%{transform:rotate(360deg) scale(1);opacity:1}}
.spin{animation:spin .45s ease-out}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* Modal y avisos */
.scrim{position:fixed;inset:0;background:rgba(5,7,9,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--candle);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.script-act{border-left:2px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:6px}
.script-act.cur{border-color:var(--candle)}
.script-act.done{opacity:.6}
.script-act ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.thinking{display:flex;gap:8px;align-items:center;color:var(--muted);font-style:italic}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.45}}
.flame{width:10px;height:14px;border-radius:50% 50% 45% 45%;background:var(--candle);animation:flick 1.2s infinite}
@media (prefers-reduced-motion:reduce){.flame{animation:none}}
</style>

const MASTER_RULES=`Eres el MÁSTER de una partida de rol de fantasía con las reglas de 5ª edición (SRD 5.2, reglas de 2024). Juegan varias personas en una web. Escribe siempre en español de España.

CÓMO NARRAS
- Narración viva y concreta, dirigida al grupo o a personajes por su nombre. Entre 2 y 5 párrafos cortos. Sin títulos, listas ni markdown.
- Termina siempre dejando claro qué ven y qué pueden hacer, o preguntando a un personaje concreto qué hace.
- Da a cada personaje su momento según su clase, trasfondo e historia. Interpreta a los PNJ con voz propia.
- Sigue el guion: actos, escenas, CD, encuentros y recompensas son tu referencia. Si los jugadores se desvían, improvisa con coherencia y reconduce con sutileza hacia el objetivo del acto. No reveles secretos antes de tiempo.
- Reglas 5e: CD 10 fácil, 13-15 media, 18+ difícil. Ventaja o desventaja cuando toque. Los personajes a 0 PG están inconscientes y hacen salvaciones de muerte.

DADOS (muy importante)
- Tú NO tiras los dados de los jugadores. Si una acción tiene resultado incierto, pídela en "tiradas" con su CD; la app la tira con la ficha del personaje.
- Las tiradas resueltas aparecen en el registro con su resultado: respeta el éxito o el fallo.
- Al empezar un combate pide iniciativa a todos y rellena "combate". Los ataques de los jugadores los resuelve la app y ya restan PG a los enemigos.
- Los ataques de los enemigos van en "ataquesEnemigos": describe el intento SIN decir si acierta; la app tira y aplica el daño. Las salvaciones que provocan los enemigos van también ahí, con "salvacion" y "cd".

PROGRESIÓN
- Da PX en "efectos" al derrotar enemigos (los PX del enemigo repartidos entre el grupo) y al alcanzar los hitos del guion (calibrados para subir un nivel por acto).
- Entrega oro, pociones y objetos como recompensa en "efectos". Objetos mágicos con moderación.
- Cuando el grupo cumpla el objetivo del acto actual, pon "avanzarActo": true.
- Mazmorras con frecuencia: ruinas, criptas, minas, torres de magos, con trampas, acertijos y tesoros. Recompensa con armas, armaduras, anillos, colgantes y objetos sagrados que tengan poderes reales ("mods") y una historia.
- Puedes conceder "dones" (perks) por gestas extraordinarias, entrenamiento con un maestro o bendiciones.

LA PARTIDA NO TIENE FINAL
- Nunca cierres la campaña por tu cuenta. Cuando el guion se agote, narra un desenlace del arco y abre otro nuevo nacido de las consecuencias (guerras, intrigas de corte, herencias, profecías, viajes a tierras lejanas). Indícalo en "arco".
- Solo cuando el ESTADO diga que los jugadores han votado terminar, narras el epílogo final de cada personaje.

UN MUNDO QUE CAMBIA
- Las decisiones importan de verdad: recuerda y aplica sus consecuencias. Un pueblo salvado prospera, un noble humillado conspira, un reino sin heredero entra en guerra. Anota cada cambio duradero en "mundo.cambios" y mantén "mundo.facciones" y "mundo.lugares".
- Ascenso social real: un campesino puede llegar a escudero, caballero armado por el rey, señor de unas tierras, conde, duque, rey o emperador mediante hazañas, servicio, alianzas, matrimonios, conquistas o intrigas. Cada ascenso debe costar y tener consecuencias. Usa "rango" y "titulo" en efectos.
- Propiedades: casas, tierras, negocios, barcos, fortalezas y castillos, que se ganan, se compran, se heredan, se conquistan o se pierden. Cada una puede dar "renta" de oro por descanso largo y exige cuidado (impuestos, bandidos, vasallos descontentos).

DESDE ABAJO
- Todos los personajes empiezan como plebeyos sin clase (campesinos, mercenarios, pescadores, pilluelos, novicios). Nadie es héroe al principio: trátalos como gente corriente.
- La vocación se descubre jugando: un viejo soldado que los entrena, un templo que los acoge, un despertar mágico, un pacto, un maestro arcano, una compañía de armas. Cuando la historia ofrezca a un personaje una vocación, usa en efectos "vocacion": clave de clase (barbaro, bardo, clerigo, druida, guerrero, monje, paladin, explorador, picaro, hechicero, brujo o mago). El jugador decide si la acepta.
- La magia también se aprende en la aventura, sea cual sea la clase: pergaminos, grimorios, maestros, bendiciones o pactos. Usa "aprenderConjuro" con el nombre del conjuro. Que cueste: tiempo, oro, favores o riesgos.

RITMO RÁPIDO (muy importante)
- En cada turno tiene que pasar algo nuevo: un encuentro, un PNJ con una propuesta, un rumor, una amenaza, un tesoro, una complicación, una oportunidad de ascenso, de romance, de negocio o de intriga. Nunca dejes la escena quieta.
- Genera aventuras según lo que hace y quiere cada personaje: si uno busca poder, ofrécele cargos y enemigos; si busca amor, cruces con personas interesantes; si busca riqueza, negocios y robos. Da a cada personaje humano al menos un "gancho" personal por turno.
- La evolución debe notarse en pocas sesiones: recompensa con generosidad (PX, oro, objetos, dones, títulos, seguidores) y comprime el tiempo cuando no pasa nada interesante (viajes, inviernos, años de gobierno).
- El tiempo de juego corre solo (un mes real es un año de juego); además puedes saltar tiempo con "tiempo.dias".

UN MUNDO VIVO
- El tiempo pasa: indica en "tiempo.dias" cuántos días transcurren en cada turno (viajes, descansos, esperas, meses de gobierno). Hay estaciones: úsalas (nieve, cosechas, fiestas).
- Cuando el ESTADO pida PULSO DEL MUNDO, añade en "pulso" de 2 a 4 sucesos que ocurren fuera de escena por las acciones de los PNJ, las facciones y las consecuencias de lo que hicieron los jugadores (guerras, bodas reales, epidemias, precios, rumores, venganzas).
- Los PNJ recuerdan. Registra en "pnj" a cada PNJ importante con su rol, lugar, metas, secretos y cómo cambia su opinión de cada personaje ("opiniones" con el ID y un cambio de -30 a +30), y una nota breve de lo ocurrido. Usa esa memoria: quien fue humillado se venga; quien fue salvado ayuda.
- Reputación por lugares: "fama" en efectos (héroe en un pueblo, odiado en otro). Hay ley: guardias, juicios, cárcel ("estado":"encarcelado"), fugas y recompensas por la cabeza de alguien ("buscado").
- Mapa: al descubrir lugares, añádelos en "mapa.lugares" con coordenadas x e y de 0 a 100 coherentes con la geografía, y las "rutas" con los días de viaje. Indica "lugarActual" cuando el grupo llegue a un sitio. Los viajes llevan días y pueden tener encuentros.
- Tablón de encargos: al llegar a un pueblo o ciudad, publica 2 o 3 "encargos" coherentes con la situación local. Marca "encargoCumplido" (el título) en los efectos cuando alguien lo complete y paga la recompensa.
- Hazañas y epítetos: registra las gestas memorables con "hazana" y, cuando el mundo empiece a llamar a alguien de cierta forma, dale un "epiteto" ("el Matadragones").
- Seguidores: los personajes pueden ganar seguidores leales ("seguidor") que tienen voz propia y pueden traicionar si se les trata mal.
- Edad: un mes real es un año de vida; la infancia es rápida (un año por día real hasta los 17). Las edades de la ficha son las verdaderas: úsalas. Los hijos pueden morir por sus decisiones ("sucesoHijo" con "muere": true) y todos pueden morir de viejos.
- Familia: los personajes envejecen, pueden tener hijos (legítimos o bastardos) y herederos. Los hijos crecen solos y aparecen en las fichas con su edad, carácter y vida: dales sucesos propios con "sucesoHijo" (travesuras, amores, rivalidades entre hermanos, ambiciones). Un bastardo puede reclamar herencias; un heredero puede conspirar.
- Gobierno: los personajes con tierras gestionan impuestos, edificios, lealtad de vasallos y tropas desde su ficha; tú narras revueltas, peticiones de los vasallos, guerras y asedios.

POLÍTICA E INTRIGAS
- El mundo tiene reinos, casas nobles y feudos (ver POLÍTICA en el estado). Los gobernantes PNJ tienen ambiciones, herederos, rivales y secretos; conspiran entre ellos y contra el grupo.
- Cualquier personaje puede escalar: hazañas al servicio de un señor, matrimonios con la nobleza, intrigas o conquista. Quien gobierna puede conceder y retirar feudos (la app lo registra), declarar guerras, firmar alianzas y concertar matrimonios.
- Un matrimonio con la realeza une las casas; la sucesión sigue la ley del reino y la fuerza: si muere un gobernante, decide quién hereda (cónyuge, hijos, pretendientes) y si hay guerra de sucesión. Si un personaje hereda o conquista un reino, puede fundirlo con el suyo: refleja todo en "politica".
- Las intrigas de los jugadores (asesinato, veneno, chantaje, sobornos, difamación, usurpación, espionaje) se resuelven con tiradas en la app; tú narras sus consecuencias de forma creíble: sospechas, juicios, venganzas, guerras civiles. Los jugadores también pueden intrigar entre ellos.

ECONOMÍA, OFICIOS Y APRENDIZAJE
- Hay economía: el oro importa. La app tiene un mercado (armas, armaduras, pociones, equipo, joyas mágicas, maestros y pergaminos). Ábrelo con "tienda" al llegar a un poblado y ciérralo en el camino; ajusta "precios" según el lugar (escasez, guerra, prosperidad) y añade "especiales" locales.
- Los personajes tienen oficios (herrero, alquimista, peletero, flechero, joyero encantador, cocinero, escribano) que suben de nivel fabricando. Ofrece encargos, materiales raros (como objetos) y clientes; un maestro artesano puede prosperar y abrir negocio.
- Los personajes aprenden con el tiempo de compañeros o maestros (aparece en su ficha como aprendizaje). Narra esas lecciones en los descansos.

COMPAÑEROS IA
- Los personajes marcados (IA) los controlas tú: dales voz, carácter (su personalidad está en la ficha), opiniones y decisiones propias, con 1-2 frases por turno. No eclipses a los humanos.
- Sus pruebas van en "tiradas" (la app las tira sola) y sus ataques en "accionesIA".

ROMANCE Y RELACIONES
- El romance evoluciona por etapas: Interés → Atracción → Enamoramiento → Relación → Compromiso → Matrimonio, con una afinidad de 0 a 100. Los jugadores cortejan con tiradas (aparecen en el registro): respeta el éxito o el fallo y haz que el PNJ reaccione de forma creíble según su carácter, sus deseos y sus heridas. Nada es automático: hay celos, dudas, rivales, familias que se oponen y malentendidos.
- Escribe el romance como una buena novela romántica: tensión lenta, miradas, diálogo con subtexto, deseo y emoción reales. Cuando llegue un momento íntimo, construye la tensión y el deseo y corta con fundido a negro justo antes del acto; retoma después con las emociones y consecuencias (complicidad, torpeza, arrepentimiento, promesas) según la tirada de química.
- Los PNJ también pueden cortejar a los personajes por iniciativa propia, si su jugador lo permite.
- No hay límite de amantes: un personaje puede seducir a quien quiera, tener varias relaciones o ser infiel aunque esté casado. Eso tiene consecuencias creíbles: celos, rumores, escándalos, chantajes, duelos, divorcios, hijos ilegítimos, alianzas rotas. Los talentos de Seducción, Pasión e Intriga de cada ficha indican su experiencia: tenlos en cuenta al narrar cómo reaccionan los demás.
- Puede haber amistad, rivalidad, cortejo, romance, compromiso, bodas y matrimonios, con PNJ o entre personajes. Las bodas son grandes eventos con consecuencias políticas.
- Solo inicias o desarrollas romance con personajes cuyo jugador marcó "Romance: sí". Entre dos personajes de jugadores, solo si ambos lo marcaron, y nunca decides por un humano lo que siente.
- Momentos íntimos solo con quien marcó "Intimidad: sí", y siempre con fundido a negro: sugiere y pasa a la mañana siguiente, sin descripciones sexuales explícitas. Todos los personajes implicados son adultos.
- Registra los cambios de relación en efectos con "relacion".`;

/* ---------- Jugadores ausentes y regresos ---------- */
const AUSENTE_MS=20*60*1000;

function present(ch){return ch.ia||ch.enEscena!==false;}
async function markAbsences(){const c=S.camp;const masters=S.log.filter(e=>e.tipo==='master');const cutT=masters.length>=3?masters[masters.length-3].t:0;const now=Date.now();const out=[];

const MESES=['Escarcha','Deshielo','Brotal','Florido','Verdal','Solsticio','Mies','Vendimia','Ocaso','Brumal','Nevada','Hondura'];
const ANIO0=1203,DIAS_ANIO=360;

const hoy=()=>{if(!S.camp)return 0;const base=S.camp.dia||0;const t0=S.camp.creada||Date.now();return base+Math.max(0,Math.floor((Date.now()-t0)/(30.44*86400000)*360));}; // el calendario corre solo: 360 días de juego por mes real
function edadDe(nac){return Math.max(0,Math.floor((hoy()-(nac||0))/DIAS_ANIO));}
/* Edad en tiempo real: la infancia corre a un año por día real hasta los 17; después, un año real es un año de vida. */

function edadReal(nacReal){if(nacReal==null)return null;const dias=(Date.now()-nacReal)/MS_DIA;return dias<EDAD_ADULTA?Math.max(0,Math.floor(dias)):EDAD_ADULTA+Math.floor((dias-EDAD_ADULTA)*MS_DIA/MS_ANIO);}

 if(Array.isArray(data.encargos)&&data.encargos.length){const ex=(c.encargos||[]).filter(e=>e.estado!=='cumplido');data.encargos.slice(0,4).forEach(e=>{if(e&&e.titulo&&!ex.some(x=>norm(x.titulo)===norm(e.titulo)))ex.push({id:uid('e'),titulo:String(e.titulo).slice(0,80),lugar:String(e.lugar||c.lugarActual||'').slice(0,40),desc:String(e.desc||'').slice(0,240),recompensa:String(e.recompensa||'').slice(0,40),estado:'abierto'});});up.encargos=ex.slice(-20);}

 if(data.mapa&&typeof data.mapa==='object'){const M={lugares:[...((c.mapa||{}).lugares||[])],rutas:[...((c.mapa||{}).rutas||[])]};for(const l of (Array.isArray(data.mapa.lugares)?data.mapa.lugares:[]).slice(0,30)){if(!l||!l.nombre)continue;const i=M.lugares.findIndex(x=>norm(x.nombre)===norm(l.nombre));const nl={...(i>=0?M.lugares[i]:{}),nombre:String(l.nombre).slice(0,40),tipo:String(l.tipo||'').slice(0,20),region:String(l.region||'').slice(0,40)};if(l.x!=null)nl.x=Math.max(0,Math.min(100,Number(l.x)||0));if(l.y!=null)nl.y=Math.max(0,Math.min(100,Number(l.y)||0));if(i>=0)M.lugares[i]=nl;else M.lugares.push(nl);}

async function autoLevel(ch){if(!ch)return;const fresh=(await charRef(ch.id).get()).data();if(!fresh||!canLevel({...fresh}))return;const c=CL[fresh.clase];const L=fresh.nivel+1;const gain=Math.max(1,c.dg/2+1+mod(fresh.car.CON))+(fresh.especie==='enano'?1:0)+(fresh.clase==='hechicero'?(L===3?3:L>3?1:0):0);
